id: themes
title: "<gradient:primary:secondary>主题</gradient> <muted>· Themes</muted>"
layout: themes
data:
  source: yaml
  search: false
  categories: false
  page-size: 21
  refresh: 10s
items:
  current:
    slot: 4
    material: BOOK
    name: "<color:text>当前主题</color>"
    lore:
      - "<gradient:primary:secondary>%bento_theme%</gradient>"
      - "<muted>左键应用 · 右键预览</muted>"
entries:
  - id: aurora
    material: AMETHYST_SHARD
    metadata:
      theme_id: aurora
      theme_name: "极光 Aurora"
      description: "深海蓝与极光紫"
    name: "<color:text>{theme_name}</color>"
    lore:
      - "<muted>{description}</muted>"
      - "<muted>左键应用 · 右键预览</muted>"
      - "<muted>ID</muted> <color:text>{theme_id}</color>"
    actions:
      - type: theme
        theme: "{theme_id}"
        mode: preview
        preview-menu: theme-preview
        click-types: [RIGHT, SHIFT_RIGHT]
      - type: theme
        theme: "{theme_id}"
        mode: apply
        click-types: [LEFT, SHIFT_LEFT]
    feedback:
      sound: ui.button.click
